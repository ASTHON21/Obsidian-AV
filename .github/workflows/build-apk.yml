name: Build Android APK

on:
  push:
    tags-ignore:
      - 'latest'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Prepare debug keystore
        run: |
          [ -f .env.example ] || touch .env.example
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare release signing keystore
        id: release_signing
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PW" ] && [ -n "$SECRET_KEY_PW" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=$SECRET_STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PW" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "mode=custom_secret" >> "$GITHUB_OUTPUT"
          else
            # Fallback CI signing key so Release APK builds and installs cleanly without extra secret setup
            CI_PASS="obsidianav-ci-release"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CI_PASS" -keypass "$CI_PASS" \
              -dname "CN=Obsidian AV, OU=Mobile, O=ObsidianAV, L=Local, S=Local, C=CN"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "mode=ci_fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Collect APKs for download
        run: |
          mkdir -p dist-apks
          cp app/build/outputs/apk/debug/app-debug.apk dist-apks/ObsidianAV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apks/ObsidianAV-release.apk
          ls -lh dist-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianAV-APKs
          path: dist-apks/*.apk
          retention-days: 30

      - name: Publish rolling GitHub Release on main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Obsidian AV Latest (Build #${{ github.run_number }})
          body: |
            由 GitHub Actions 自动构建的 **Obsidian AV** 最新安装包（分支 `${{ github.ref_name }}`，构建号 `#${{ github.run_number }}`）。

            直接点击下方 `.apk` 文件即可下载安装（若未配置固定签名 Secret 导致与旧版本安装冲突，请先卸载旧版本后再安装）。
          make_latest: true
          files: |
            dist-apks/ObsidianAV-release.apk
            dist-apks/ObsidianAV-debug.apk

      - name: Publish versioned GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            dist-apks/ObsidianAV-release.apk
            dist-apks/ObsidianAV-debug.apk
